[project]
name = "GradientGang"
version = "0.1.0"
description = ""
authors = [
    { name = "Paolo Ginefra", email = "ginefra.paolo@gmail.com" },
    { name = "Martina Missana", email = "martina.missana@mail.polimi.it" },
    { name = "Lorenzo Pettenuzzo", email = "lorenzo.pettenuzzo@mail.polimi.it" },
    { name = "Matteo Pasqual", email = "matteoromilio.pasqual@mail.polimi.it" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.12,<3.15"
dependencies = ["pytest (>=8.4.1,<9.0.0)", "numpy (>=2.3.4,<3.0.0)", "pandas (>=2.3.3,<3.0.0)", "scikit-learn (>=1.7.2,<2.0.0)", "matplotlib (>=3.10.7,<4.0.0)", "seaborn (>=0.13.2,<0.14.0)", "scipy (>=1.16.2,<2.0.0)", "torch (>=2.9.0,<3.0.0)", "torchvision (>=0.24.0,<0.25.0)", "lightning (>=2.5.5,<3.0.0)"]

[tool.poetry]
packages = [{ include = "GradientGang", from = "src" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
